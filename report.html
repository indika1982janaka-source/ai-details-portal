<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ලියාපදිංචි ගොවිපල විස්තර (Registered Farm details) - ඉබ්බාගමුව පශු වෛද්‍ය කාර්යාලය</title>
  
  <!-- Tailwind CSS - Open Source UI Framework -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  
  <style>
    /* සිංහල Fonts සදහා */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Noto Sans Sinhala'; 
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
    }
    .data-card { 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      border-left: 5px solid #3b82f6;
    }
    .data-card:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
    }

    /* ලා නිල් (Light Blue) වර්ණයෙන් යුත් අලංකාර Animated Search Box එක */
    .animated-search-box {
      background: linear-gradient(135deg, #ebf8ff 0%, #e0f2fe 100%);
      border: 2px solid #bae6fd;
      position: relative;
      overflow: hidden;
      transition: all 0.4s ease;
    }
    .animated-search-box::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
      transform: rotate(45deg);
      animation: pulseGlow 6s infinite linear;
      pointer-events: none;
    }
    @keyframes pulseGlow {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .animated-search-box:hover {
      border-color: #38bdf8;
      box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.25);
    }

    .loader { border-top-color: #3b82f6; -webkit-animation: spinner 1.2s linear infinite; animation: spinner 1.2s linear infinite; }
    @-webkit-keyframes spinner { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen text-gray-800">

  <!-- Header with Modern Gradient Background -->

      <div class="flex items-center gap-3">

          <img src="https://img.icons8.com/color/48/cow.png" alt="Cow Icon" class="w-9 h-9">
        </div>
        <h1 class="text-lg md:text-xl font-bold tracking-wide">කෘත්‍රිම සිංචන තොරතුරු - ඉබ්බාගමුව පශු වෛද්‍ය කාර්යාලය</h1>
      </div>

      <nav class="flex items-center gap-2 bg-white/10 p-1.5 rounded-xl backdrop-blur-md border border-white/20">
        <a href="index.html" class="text-white hover:bg-white/20 font-medium px-4 py-2 rounded-lg text-sm transition">කෘත්‍රිම සිංචන දත්ත</a>
        <a href="report.html" class="bg-white text-blue-900 font-bold px-4 py-2 rounded-lg text-sm transition shadow-md">ලියාපදිංචි ගොවිපල විස්තර</a>
      </nav>

    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto p-6">
    
    <!-- Animated Light Blue Search Section -->
    <div class="animated-search-box p-6 md:p-8 rounded-3xl shadow-xl mb-8">
      <h2 class="text-lg md:text-xl font-extrabold text-sky-900 mb-6 flex items-center gap-3">
        <div class="p-2 bg-sky-500 text-white rounded-xl shadow-md">
          <svg class="w-6 h-6 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        ගොවිමහතාගේ නම (Name of Farmer) ඩ්‍රොප්ඩවුන් එකෙන් තෝරන්න හෝ සෘජුවම ටයිප් කරන්න
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-1 gap-4 mb-5 relative z-10">
        <!-- Farmer Name Input with Datalist for Dropdown & Direct Typing -->
        <div>
          <label class="block text-sm font-bold text-sky-900 mb-2">ගොවිමහතාගේ නම (Name of Farmer):</label>
          <input type="text" id="farmerNameInput" list="farmerNameOptions" placeholder="නම ටයිප් කරන්න හෝ ඩ්‍රොප්ඩවුන් එකෙන් තෝරන්න..." oninput="onFarmerNameInput()" onchange="onFarmerNameInput()" class="w-full p-4 border-2 border-sky-200 rounded-2xl focus:outline-none focus:ring-4 focus:ring-sky-400/30 focus:border-sky-500 bg-white/90 backdrop-blur-sm transition font-medium shadow-sm" autocomplete="off">
          <datalist id="farmerNameOptions">
            <!-- JavaScript හරහා දත්ත මෙහි පිරවේ -->
          </datalist>
        </div>
      </div>

      <!-- Reset / Clear Button -->
      <div class="flex justify-end relative z-10">
        <button onclick="resetSearch()" class="bg-white hover:bg-sky-50 text-sky-800 font-bold px-6 py-3 rounded-xl text-sm transition shadow-md border border-sky-200 flex items-center gap-2 transform hover:-translate-y-0.5">
          <svg class="w-4 h-4 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          නැවත සකසන්න (Reset)
        </button>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="hidden flex flex-col items-center justify-center p-12 text-gray-600">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
      <p class="font-medium">දත්ත පූරණය වෙමින් පවතී, කරුණාකර රැඳී සිටින්න...</p>
    </div>

    <!-- Results Display Area -->
