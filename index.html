<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ගොවිපළ තොරතුරු පද්ධතිය | Dairy Farm Data Portal</title>
  
  <!-- Tailwind CSS - Open Source UI Framework -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  
  <style>
    /* සිංහල Fonts සදහා */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Noto Sans Sinhala'; }
    .data-card { transition: all 0.3s ease; }
    .data-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); }
    .loader { border-top-color: #3498db; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
    @-webkit-keyframes spinner { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-md p-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="https://img.icons8.com/color/48/cow.png" alt="Cow Icon" class="w-10 h-10">
        <h1 class="text-3xl font-bold text-gray-800">ගොවිපළ තොරතුරු පද්ධතිය</h1>
      </div>
      <p class="text-sm text-gray-500">Data Source: Google Sheet (සජීවීව)</p>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto p-6">
    
    <!-- Search Section -->
    <div class="bg-white p-6 rounded-xl shadow-sm mb-8">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">ගොවිපල අංකය 6130 සමග අවසන් ඉලක්කම 4 හෝ ගොවිමහතාගේ නම යොදන්න</h2>
      <div class="flex flex-col md:flex-row gap-4">
        <input type="text" id="searchInput" placeholder="උදා: 61304 හෝ කුමාර දිසානායක..." class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        <button onclick="filterData()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-lg flex items-center gap-2 justify-center transition">
          <img src="https://img.icons8.com/ios-glyphs/30/ffffff/search--v1.png" class="w-5 h-5"/>
          සොයන්න
        </button>
      </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="hidden flex flex-col items-center justify-center p-12 text-gray-600">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
      <p>දත්ත පූරණය වෙමින් පවතී, කරුණාකර රැඳී සිටින්න...</p>
    </div>

    <!-- Results Display Area -->
    <div id="resultsContainer" class="space-y-6">
      <div class="text-center p-16 bg-white rounded-xl shadow-inner text-gray-500">
        <img src="https://img.icons8.com/isometric/100/search-property.png" alt="Search Property Icon" class="mx-auto mb-4"/>
        සෙවුම් කිරීමට ගොවිපල අංකය හෝ නම ඇතුළත් කර 'සොයන්න' ක්ලික් කරන්න.
      </div>
    </div>

  </main>

  <footer class="text-center p-6 text-gray-500 text-sm mt-12 border-t border-gray-200">
    © 2026 Dairy Farm Data Portal. Built with Open Source Tech.
  </footer>

  <script>
    // --- CONFIGURATION ---
    const API_URL = "https://script.google.com/macros/s/AKfycbw1XSGoey4yFuvV_gMg37sQpOA3-YAseHX67FT8n-0clTmcxv-U6qFhCqPj6T17CTCS/exec"; 
    // --- END CONFIGURATION ---

    let farmData = [];

    // API එකෙන් Data Fetch කර ගැනීම
    async function loadData() {
      const loading = document.getElementById('loadingIndicator');
      loading.classList.remove('hidden');
      
      try {
        const res = await fetch(API_URL);
        farmData = await res.json();
        console.log("Data Loaded:", farmData);
      } catch (error) {
        console.error("Error loading data:", error);
        document.getElementById('resultsContainer').innerHTML = `
          <div class="text-center p-12 bg-red-50 text-red-600 rounded-xl border border-red-200">
            <h3 class="font-bold text-lg mb-2">Error Connecting to Data Source</h3>
            <p>ගූගල් ෂීට් එක සමඟ සම්බන්ධ වීමට නොහැකි විය. Web App URL එක පරීක්ෂා කරන්න.</p>
          </div>
        `;
      } finally {
        loading.classList.add('hidden');
      }
    }

    // Filter කිරීමේ ප්‍රධාන Function එක
    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      if (!query) {
        container.innerHTML = `<p class="text-center p-12 text-gray-500">කරුණාකර සෙවුම් පදයක් ඇතුළත් කරන්න.</p>`;
        return;
      }

      const filtered = farmData.filter(item => 
        (item['Farm_ID'] && item['Farm_ID'].toString().toLowerCase().includes(query)) ||
        (item['Farmer_Name'] && item['Farmer_Name'].toString().toLowerCase().includes(query))
      );

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center p-16 bg-white rounded-xl shadow-inner text-red-500">
            <img src="https://img.icons8.com/isometric/100/delete-property.png" alt="Not Found Icon" class="mx-auto mb-4"/>
            '<strong>${query}</strong>' සදහා තොරතුරු හමු නොවීය. කරුණාකර වෙනත් අංකයක් හෝ නමක් පරීක්ෂා කරන්න.
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const farmIdStr = (item['Farm_ID'] || '').toString().toLowerCase();
        
        let primaryTitle = '';
        let secondaryTitle = '';

        // Farm ID යෙදූ විට Farmer Name පෙනෙන සේ සහ Farmer Name යෙදූ විට Farm ID පෙනෙන සේ
        if (farmIdStr.includes(query)) {
          primaryTitle = `<span class="text-gray-500 text-sm block mb-1">Farmer Name:</span> <span class="text-blue-900">${item['Farmer_Name'] || '-'}</span>`;
          secondaryTitle = `Farm ID: <span class="font-semibold text-gray-800">${item['Farm_ID'] || '-'}</span>`;
        } else {
          primaryTitle = `<span class="text-gray-500 text-sm block mb-1">Farm ID:</span> <span class="text-blue-900">${item['Farm_ID'] || '-'}</span>`;
          secondaryTitle = `Farmer Name: <span class="font-semibold text-gray-800">${item['Farmer_Name'] || '-'}</span>`;
        }

        const card = `
          <div class="data-card bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 border-b border-gray-200 pb-4">
              <div>
                <h2 class="text-2xl font-bold">${primaryTitle}</h2>
                <p class="text-lg text-gray-600 mt-1">${secondaryTitle}</p>
              </div>
              <div class="text-left md:text-right text-gray-600 bg-gray-50 p-3 rounded-lg border border-gray-100">
                <p><strong>ලිපිනය:</strong> ${item['Address'] || '-'}</p>
                <p><strong>දුරකථන:</strong> ${item['Contact_no'] || '-'}</p>
              </div>
            </div>

            <!-- Detailed Grid (Milk Centre, BCS, Total Daily MP ඉවත් කර ඇත) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-3 text-sm">
              <p><strong>Date:</strong> ${item['Date'] || '-'}</p>
              <p><strong>Cow ID:</strong> ${item['Cow_ID'] || '-'}</p>
              <p><strong>Cow Name:</strong> ${item['Cow_Name'] || '-'}</p>
              <p><strong>Pregnancy:</strong> ${item['Pregnancy'] || '-'}</p>
              <p><strong>Date to be calved:</strong> ${item['Date_to_be_calved'] || '-'}</p>
              <p><strong>Milk Production:</strong> ${item['Milk_Production'] || '-'} L</p>
              <p><strong>Next Heat:</strong> ${item['Next_Heat'] || '-'}</p>
              <p><strong>Calve Name/ID:</strong> ${item['Calve_name'] || '-'} (${item['Calve_ID'] || '-'})</p>
              <p><strong>Semen Code:</strong> ${item['Semen_code'] || '-'}</p>
              <p><strong>Receipt no:</strong> ${item['Receipt_no'] || '-'}</p>
            </div>
            
            <!-- File/Photo Links -->
            <div class="mt-6 pt-4 border-t border-gray-100 flex flex-wrap gap-4 text-sm">
              ${item['Semen_deposit_photo'] ? `<a href="${item['Semen_deposit_photo']}" target="_blank" class="bg-blue-50 text-blue-700 font-medium px-4 py-2 rounded-full hover:bg-blue-100 transition">Semen Deposit Photo බලන්න →</a>` : ''}
              ${item['pdf'] ? `<a href="${item['pdf']}" target="_blank" class="bg-green-50 text-green-700 font-medium px-4 py-2 rounded-full hover:bg-green-100 transition">PDF Document එක බලන්න →</a>` : ''}
            </div>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    // පිටුව Load වන විට Data ලෝඩ් කිරීම ආරම්භ කරයි
    loadData();
  </script>
</body>
</html>
